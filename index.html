.hero.img::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.hero>*{position:relative}
h1,h2,h3,.colh,.badge,.cnt{font-weight:400}
.hero h1{margin:0 0 6px;font-size:clamp(1.8rem,5vw,2.8rem)}
.hero p{margin:0;opacity:.92;font-size:1.05rem}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:8px;justify-content:center;margin:6px 0 20px;flex-wrap:wrap}
button,.btn,select,input,textarea{font:inherit}
.tab{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 16px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.cb{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{margin:0;font-size:1.1rem}
.cb p{margin:0;color:var(--muted);white-space:pre-wrap;flex:1}
.badge{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--c);font-weight:700}
.btn{display:inline-block;text-align:center;text-decoration:none;background:var(--c);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.pri{background:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.bar{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:5;max-width:calc(100% - 24px)}
.bar .btn{box-shadow:0 2px 8px rgba(0,0,0,.25);padding:7px 12px}
.ctl{display:flex;gap:6px;padding:0 14px 12px}
.ctl .btn{padding:4px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:10}
.panel{background:var(--card);color:var(--fg);border-radius:14px;padding:20px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0}
.panel label{display:flex;flex-direction:column;gap:3px;font-size:.88rem;color:var(--muted)}
.panel input,.panel textarea,.panel select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.panel input[type=color]{padding:2px;height:38px}
.row{display:flex;gap:8px}.row>*{flex:1}
.thumb{max-width:100%;max-height:120px;border-radius:8px}
.note{font-size:.8rem;color:var(--muted)}
.wrap{max-width:1200px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:start}
.col{background:color-mix(in srgb,var(--card) 55%,var(--bg));border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0}
.colh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.09em}
.colh>span:first-child{flex:1}
.cnt{background:var(--accent);color:#fff;border-radius:999px;padding:1px 9px;font-size:.75rem}
.colh .btn{padding:1px 10px}
.colbody{padding:12px;display:flex;flex-direction:column;gap:12px}
.col .card{border-top:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.col .empty{padding:18px 0;font-size:.9rem}
.colmgr{display:flex;flex-direction:column;gap:6px}
.colmgr .btn{flex:0 0 auto}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:1.8rem;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:14}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:12}
.fabpanel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
.soc{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.soc .note{color:#ddd}
.socrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.12)}
.bigs{display:flex;flex-direction:row;justify-content:center;gap:28px}
.big{display:flex;align-items:center;justify-content:center;width:88px;height:88px;border-radius:50%;text-decoration:none;color:#fff;background:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35);cursor:pointer}
.big svg{width:44px;height:44px;fill:currentColor}
.big.tiktok{background:#000}
.big.discord{background:#5865f2}
.big{transition:transform .22s cubic-bezier(.3,1.4,.5,1),filter .12s ease}
.big:hover{transform:scale(1.22)}
.big:hover:active{transform:scale(1.05)}
.big.off:hover{transform:none}
.off{opacity:.45;cursor:default}
.mascot{--h:min(520px,calc((100vw - 130px)/.576));display:flex;align-items:flex-start;justify-content:center;gap:14px;margin:26px auto 0}
.mbtns{display:flex;flex-direction:column;gap:14px;margin-top:calc(64px + var(--h)*.08)}
.mascot .big{width:64px;height:64px}
.mascot .big svg{width:32px;height:32px}
.fig{position:relative;flex:none;margin-top:64px}
.crop{height:calc(var(--h)*.52);overflow:hidden}
.fig img{height:var(--h);width:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.bubble{position:absolute;left:60%;bottom:calc(100% + 8px);transform:translateX(-90px);background:#fff;color:#000;border:3px solid #000;border-radius:18px;padding:9px 16px;font-size:1.25rem;line-height:1.3;white-space:nowrap;box-shadow:4px 4px 0 #000;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.bubble::before{content:"";position:absolute;left:78px;top:100%;border:12px solid transparent;border-top-color:#000;border-bottom:0}
.bubble::after{content:"";position:absolute;left:81px;top:100%;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bob{0%,100%{transform:translateX(-90px) translateY(0)}50%{transform:translateX(-90px) translateY(-6px)}}
.off:active{transform:none!important}
button,.btn,.chip,.big,.tab{transition:transform .12s ease,filter .12s ease;-webkit-tap-highlight-color:transparent}
button:active,.btn:active,.chip:active,.big:active{transform:scale(.9)}
.btn:hover,.big:hover,.chip:hover,.fab:hover{filter:brightness(1.12)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.88)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.spin{animation:spin .4s ease}
@keyframes spin{from{transform:rotate(-180deg) scale(.6)}to{transform:rotate(0) scale(1)}}
.dim,.ov{animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fabpanel>*{animation:rise .3s ease both}
.fabpanel>*:nth-child(2){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');

function pwPanel(){
  const msg=h('p',{class:'note',textContent:'Inserisci la password per entrare in modalità admin.'});
  const inp=h('input',{type:'password',autocomplete:'current-password',placeholder:'Password'});
  let busy=false;
  const go=async()=>{if(busy)return;busy=true;msg.textContent='Controllo…';
    try{const ok=(await pbk(inp.value,S.auth.salt,S.auth.iter))===S.auth.hash;
      if(ok){modal=null;edit=true;render();return}
      msg.textContent='Password errata.';inp.value='';await new Promise(r=>setTimeout(r,1500))
    }catch(e){msg.textContent='Impossibile verificare la password su questo browser.'}
    busy=false};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  setTimeout(()=>inp.focus(),50);
